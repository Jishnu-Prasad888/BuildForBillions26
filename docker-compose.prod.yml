# Production deployment. See DEPLOYMENT.md.
#   cp .env.prod.example .env.prod   # set passwords and secrets
#   cp backend/.env.example backend/.env   # app settings (LLM provider, keys, ...)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
#   Internet ──► proxy (nginx: SPA + per-IP flood limit) ──► backend × N (FastAPI, per-user GCRA limits)
#                                                              │
#   worker × 1 (Telegram bot, background re-embedding) ───────┤
#                                                              ▼
#                          private network: postgres · neo4j · redis (shared rate-limit state) · ollama (optional)

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  build: ./backend
  image: sahayak-backend:latest
  env_file: [backend/.env]
  restart: unless-stopped
  logging: *logging
  volumes:
    - ./data/seed:/data/seed:ro
    - ./scheme:/scheme:ro
    - uploads:/data/uploads
    - userforms:/data/users
  depends_on:
    postgres: { condition: service_healthy }
    neo4j: { condition: service_healthy }
    redis: { condition: service_healthy }
    chroma: { condition: service_started }

x-app-env: &app-env
  APP_ENV: production
  DEBUG: "false"
  SEED_DIR: /data/seed
  UPLOAD_DIR: /data/uploads
  FORMS_DIR: /data/users
  SCHEME_DIR: /scheme
  # One Chroma server shared by every API replica and the worker (the worker runs the scheme-folder sync).
  VECTOR_BACKEND: chroma
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/public_service_ai
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.prod}
  NEO4J_CONNECT_RETRIES: "20"
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env.prod}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
  # backends are reachable only through the proxy, so trust its X-Forwarded-For
  FORWARDED_ALLOW_IPS: "*"

services:
  proxy:
    build: ./frontend
    image: sahayak-proxy:latest
    ports: ["${HTTP_PORT:-80}:80"]
    restart: unless-stopped
    logging: *logging
    networks: [public]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  backend:
    <<: *app
    environment:
      <<: *app-env
      RUN_BACKGROUND_TASKS: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    networks: [public, private]
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # Exactly one: runs the Telegram bot poller and the background re-embed loop. Not routed by the proxy.
  worker:
    <<: *app
    environment:
      <<: *app-env
      RUN_BACKGROUND_TASKS: "true"
      WEB_CONCURRENCY: "1"
    networks: [public, private]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    image: redis:7-alpine
    # Rate-limit state only: nothing to persist, bounded memory, evict oldest-to-expire keys.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    restart: unless-stopped
    logging: *logging
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: public_service_ai
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    logging: *logging
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_service_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.prod}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4jdata:/data]
    restart: unless-stopped
    logging: *logging
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }

  chroma:
    image: chromadb/chroma:1.5.9  # keep in step with chromadb in backend/requirements.txt
    environment:
      ANONYMIZED_TELEMETRY: "false"
    volumes: [chromadata:/data]
    restart: unless-stopped
    logging: *logging
    networks: [private]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # Optional local models: --profile ollama (and set OLLAMA_BASE_URL=http://ollama:11434 in backend/.env)
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    logging: *logging
    networks: [public, private]

networks:
  public: {}
  private:
    internal: true  # no ingress or egress: databases are unreachable from outside

volumes:
  pgdata:
  neo4jdata:
  chromadata:
  ollama:
  uploads:
  userforms:
