# Edge proxy: serves the SPA and load-balances /api across backend replicas.
# The app enforces per-user limits (GCRA, shared via Redis); this layer only absorbs
# floods per IP. Kept generous because many mobile users share one carrier NAT address.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # Docker's DNS; re-resolve every 10s so scaled/restarted replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self), display-capture=(self)" always;

  error_page 429 = @too_many;
  location @too_many {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"detail":"Too many requests. Please slow down and try again."}';
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn conn_per_ip 40;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self), display-capture=(self)" always;
    try_files $uri /index.html;
  }
}
